# .coderabbit.yaml
language: "ja-JP"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false # 些細な指摘でブロックしない
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"

  path_instructions:
    - path: "**/*"
      instructions: |
        ## 共通レビュー方針
        - 変数名・命名規則・スペース・フォーマットなどのnitsは絶対に指摘しない
        - 指摘は Must Fix / Should Fix / 提案 の3段階で分類して出力する
        - 問題がなければ「問題なし」と簡潔に返す

        ## Must Fix（必須修正）の基準
        - ゼロ除算・NullPointerなど実行時エラーになるバグ
        - 認証・認可の欠落、シークレットのハードコード等のセキュリティ問題
        - データ破損・不正な上書きが起きるロジック

        ## Should Fix（修正推奨）の基準
        - 空リスト・空DataFrameなどのエッジケース未考慮
        - O(n²)以上の非効率なループ・大量データで問題になるパフォーマンス
        - エラーハンドリングの欠落
        - 副作用のある関数が意図せず呼ばれる設計上のリスク

        ## 提案（任意対応）の基準
        - より読みやすい実装・Pythonらしい書き方
        - テスト容易性の改善案

    - path: "**/*.py"
      instructions: |
        データチームのPythonコードとして以下も確認してください：
        - pandasやpolarsのDataFrame操作で、空DataFrameや欠損値（NaN）の考慮が漏れていないか
        - ループでのDataFrame行操作（iterrows等）は避け、ベクトル演算を推奨
        - 大量データを扱う場合のメモリ効率（chunking, generatorの活用など）
        - SQLクエリ文字列の直接組み立てによるインジェクションリスク
        - 日付・タイムゾーン処理の考慮漏れ

    - path: "**/*.sql"
      instructions: |
        SQLのレビューとして以下を確認してください：
        - WHERE句の欠落による全件更新・全件削除のリスク
        - JOINの条件漏れによるデカルト積の発生
        - NULLの扱い（IS NULL vs = NULLなど）
        - インデックスが効かない検索条件になっていないか

    - path: ".github/workflows/*.yml"
      instructions: |
        GitHub Actionsのセキュリティレビューとして以下を確認してください：
        - ${{ }}によるスクリプトインジェクションのリスク
        - シークレットが意図せずログに出力されていないか
        - pull_request_targetの不適切な使用
